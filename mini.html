<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Mini Details</title>

    <!-- Egységes tipográfia -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        /* Globális konténer */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Kártya dizájn */
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        /* Képek egységes stílusa */
        .card img {
            width: 100%;
            border-radius: 10px;
        }

        /* Szöveg stílus */
        p {
            line-height: 1.6;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Kollázs kártya -->
    <div class="card">
        <img src="img/collage.jpg" alt="Kollázs">
    </div>

    <!-- Szöveges rész kártyában -->
    <div class="card">
        <p>
            Itt jön a szöveges rész, amit szeretnél szépen megjeleníteni.
            Ugyanabban a stílusban, mint a főoldalon: letisztult, elegáns,
            egységes spacinggel és tipográfiával.
        </p>
    </div>

    <!-- PDF kártyában -->
    <div class="card">
        <iframe 
            src="pdf/Mini-Details.pdf"
            style="width:100%; height:900px; border:none; border-radius:10px; 
                   box-shadow:0 0 10px rgba(0,0,0,0.1);">
        </iframe>
    </div>

</div>

</body>
</html>
